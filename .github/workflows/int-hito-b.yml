        if: ${{ !inputs.adopt_worker_profile && inputs.worker_benchmark_base == '' && !inputs.focused_c04_styles && !inputs.focused_c05_framing && !inputs.focused_c06_zip && !inputs.focused_creator_logos && !inputs.focused_caption_color && !inputs.focused_mixed_zip && !inputs.focused_d01 && !inputs.focused_d02 && !inputs.focused_d03 && !inputs.focused_e01 && steps.reuse_scope.outputs.mode != 'deletion' }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh capacity-editorial

      - name: Publish the long editorial evidence
        if: ${{ always() && (steps.capacity_editorial.outcome == 'success' || steps.capacity_editorial.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hito-b-int-${{ github.run_id }}-${{ github.run_attempt }}-editorial
          path: |
            ${{ env.DELIVERY_DIR }}/reports/after-rollout.json
            ${{ env.DELIVERY_DIR }}/reports/browser-capacity.json
          if-no-files-found: error

      - name: Clean up this run's synthetic accounts after a failure
        if: ${{ always() && !inputs.adopt_worker_profile && inputs.worker_benchmark_base == '' && (failure() || cancelled()) && (steps.capacity_setup.outcome == 'success' || steps.capacity_setup.outcome == 'failure' || steps.capacity_setup.outcome == 'cancelled') }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh capacity-cleanup

      - name: Restore the previous INT components after a failed acceptance
        if: ${{ always() && !inputs.adopt_worker_profile && inputs.worker_benchmark_base == '' && (failure() || cancelled()) && (steps.acceptance_open.outcome == 'success' || steps.acceptance_open.outcome == 'failure' || steps.acceptance_open.outcome == 'cancelled' || ((inputs.focused_c04_styles || inputs.focused_c05_framing || inputs.focused_c06_zip || inputs.focused_creator_logos || inputs.focused_caption_color || inputs.focused_mixed_zip || inputs.focused_d01 || inputs.focused_d02 || inputs.focused_d03 || inputs.focused_e01) && steps.deploy_prepare.outcome == 'success')) }}
        run: bash scripts/deploy_int_beta.sh rollback

      - name: Remove only the work and account prepared for the focused browser check
        if: ${{ always() && (inputs.focused_caption_color || inputs.focused_mixed_zip) && steps.acceptance_open.outcome != 'skipped' }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh caption-color-cleanup

      - name: Remove only the projects and accounts prepared for D01
        if: ${{ always() && inputs.focused_d01 && steps.acceptance_open.outcome != 'skipped' }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh d01-cleanup

      - name: Remove only the projects and accounts prepared for D02
        if: ${{ always() && inputs.focused_d02 && steps.acceptance_open.outcome != 'skipped' }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh d02-cleanup

      - name: Remove only the projects and accounts prepared for D03
        if: ${{ always() && inputs.focused_d03 && steps.acceptance_open.outcome != 'skipped' }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh d03-cleanup

      - name: Remove only the project and accounts prepared for E01
        if: ${{ always() && inputs.focused_e01 && steps.acceptance_open.outcome != 'skipped' }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh e01-cleanup

      - name: Record the accepted services, worker, and matched fixture
        id: worker_benchmark_prepare
        if: inputs.worker_benchmark_base != ''
        run: bash scripts/deploy_int_beta.sh benchmark-prepare

      - name: Publish the worker recovery checkpoint before any resource change
        if: steps.worker_benchmark_prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-baseline
          path: ${{ env.DELIVERY_DIR }}/reports/worker-benchmark-baseline.json
          if-no-files-found: error

      - name: Create three synthetic accounts for the 2 vCPU cohort
        id: worker_benchmark_setup_2
        if: inputs.worker_benchmark_base != ''
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh benchmark-setup 2

      - name: Publish the scoped 2 vCPU account receipt
        if: ${{ always() && (steps.worker_benchmark_setup_2.outcome == 'success' || steps.worker_benchmark_setup_2.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-cpu2-setup
          path: ${{ env.DELIVERY_DIR }}/reports/worker-benchmark-cpu2-setup.json
          if-no-files-found: error

      - name: Measure three concurrent creators at 2 vCPU and 4 GiB
        id: worker_benchmark_2
        if: inputs.worker_benchmark_base != ''
        run: bash scripts/deploy_int_beta.sh benchmark-run 2

      - name: Publish the 2 vCPU comparison evidence
        if: ${{ always() && (steps.worker_benchmark_2.outcome == 'success' || steps.worker_benchmark_2.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-cpu2
          path: ${{ env.DELIVERY_DIR }}/reports/worker-benchmark-cpu2-*.json
          if-no-files-found: error

      - name: Create three distinct synthetic accounts for the 4 vCPU cohort
        id: worker_benchmark_setup_4
        if: inputs.worker_benchmark_base != ''
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh benchmark-setup 4

      - name: Publish the scoped 4 vCPU account receipt
        if: ${{ always() && (steps.worker_benchmark_setup_4.outcome == 'success' || steps.worker_benchmark_setup_4.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-cpu4-setup
          path: ${{ env.DELIVERY_DIR }}/reports/worker-benchmark-cpu4-setup.json
          if-no-files-found: error

      - name: Measure three concurrent creators at 4 vCPU and 4 GiB
        id: worker_benchmark_4
        if: inputs.worker_benchmark_base != ''
        run: bash scripts/deploy_int_beta.sh benchmark-run 4

      - name: Restore and verify the original worker configuration
        if: ${{ always() && steps.worker_benchmark_prepare.outcome == 'success' }}
        run: bash scripts/deploy_int_beta.sh benchmark-restore

      - name: Remove only the benchmark projects and deactivate their accounts
        if: ${{ always() && steps.worker_benchmark_prepare.outcome == 'success' }}
        env:
          INT_BOOTSTRAP_ADMIN_JSON: ${{ secrets.INT_BOOTSTRAP_ADMIN_JSON }}
        run: bash scripts/deploy_int_beta.sh benchmark-cleanup

      - name: Retain the comparison, recovery, and cleanup receipts
        if: ${{ always() && steps.worker_benchmark_prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DELIVERY_DIR }}/reports/worker-benchmark-*.json
          if-no-files-found: error

      - name: Retain public acceptance and scoped rollout evidence
        if: ${{ always() && !inputs.adopt_worker_profile && inputs.worker_benchmark_base == '' && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hito-b-int-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DELIVERY_DIR }}/reports
          if-no-files-found: warn
