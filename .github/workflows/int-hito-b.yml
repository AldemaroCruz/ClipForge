          replay_source=9139a28835b6bf5a978c0b09bb16f8070dfcbe9b
          parent="$(git rev-parse HEAD^)"
          case "$parent" in
            "$provider_source") mode=provider; scope_base="$provider_source" ;;
            "$deletion_source"|"$replay_source")
