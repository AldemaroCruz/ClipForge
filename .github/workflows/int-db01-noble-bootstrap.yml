name: ClipForge INT Noble protected PostgreSQL bootstrap

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact approved SHA of the Noble controls
        required: true
        type: string
      review_run_id:
        description: Run owning the reviewed evidence artifact
        required: true
        type: string
      review_artifact_id:
        description: Exact private evidence artifact containing the owner decision
        required: true
        type: string
      decision_sha256:
        description: SHA256 of the approved private decision
        required: true
        type: string
      review_sha256:
        description: SHA256 of the exact operation review
        required: true
        type: string
      binding_sha256:
        description: SHA256 of the independently approved operation binding
        required: true
        type: string

permissions: {}
concurrency:
  group: clipforge-int-db01-noble
  cancel-in-progress: false

env:
  INT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
  OWNER_ARTIFACT: ${{ inputs.review_artifact_id }}
  OWNER_RUN: ${{ inputs.review_run_id }}
  DECISION_SHA: ${{ inputs.decision_sha256 }}
  REVIEW_SHA: ${{ inputs.review_sha256 }}
  BINDING_SHA: ${{ inputs.binding_sha256 }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  local-preflight:
    if: github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      verified_commit: ${{ steps.verify.outputs.verified_commit }}
    steps:
      - name: Check out the approved immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require exact code and artifact references
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$INT_APPROVED_COMMIT"
          [[ "$OWNER_ARTIFACT" =~ ^[1-9][0-9]*$ && "$OWNER_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$DECISION_SHA" =~ ^[a-f0-9]{64}$ && "$REVIEW_SHA" =~ ^[a-f0-9]{64}$ && "$BINDING_SHA" =~ ^[a-f0-9]{64}$ ]]
          umask 077
          echo "BUNDLE=$(mktemp -d "$RUNNER_TEMP/clipforge-noble-bootstrap-review.XXXXXXXX")" >> "$GITHUB_ENV"
      - name: Receive the owner decision and scoped evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.review_artifact_id }}
          run-id: ${{ inputs.review_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.BUNDLE }}
          merge-multiple: true
      - name: Validate the local contract without OIDC or GCP credentials
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python -B -m scripts.int_noble_bootstrap_db local --bundle "$BUNDLE" --decision-sha256 "$DECISION_SHA" --review-sha256 "$REVIEW_SHA" --binding-sha256 "$BINDING_SHA"
          echo "verified_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  protected-bootstrap:
    needs: local-preflight
    if: needs.local-preflight.result == 'success' && needs.local-preflight.outputs.verified_commit == github.sha
    environment: int
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GUEST_APPROVED_COMMIT: ${{ inputs.approved_commit }}
      GUEST_ENVIRONMENT: int
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      INT_NOBLE_PROTECTED_DECISION_SHA256: ${{ vars.INT_NOBLE_BOOTSTRAP_DECISION_SHA256 }}
      INT_NOBLE_PROTECTED_REVIEW_SHA256: ${{ vars.INT_NOBLE_BOOTSTRAP_REVIEW_SHA256 }}
      INT_NOBLE_PROTECTED_BINDING_SHA256: ${{ vars.INT_NOBLE_BOOTSTRAP_BINDING_SHA256 }}
      INT_NOBLE_PROTECTED_GATE_MODE: ${{ vars.INT_NOBLE_BOOTSTRAP_GATE_MODE || 'global' }}
    steps:
      - name: Check out the same immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Allocate private scratch for this reviewed operation
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_SHA" = "$INT_APPROVED_COMMIT"
          test "$DECISION_SHA" = "$INT_NOBLE_PROTECTED_DECISION_SHA256"
          test "$REVIEW_SHA" = "$INT_NOBLE_PROTECTED_REVIEW_SHA256"
          test "$BINDING_SHA" = "$INT_NOBLE_PROTECTED_BINDING_SHA256"
          git check-ignore --no-index --quiet gha-creds-noble-bootstrap.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          work="$(mktemp -d "$RUNNER_TEMP/clipforge-guest-inventory.XXXXXXXX")"
          reports="$(mktemp -d "$RUNNER_TEMP/clipforge-guest-report.XXXXXXXX")"
          bundle="$(mktemp -d "$RUNNER_TEMP/clipforge-noble-bootstrap-review.XXXXXXXX")"
          printf 'BUNDLE=%s\nGUEST_WORK=%s\nGUEST_REPORTS=%s\nCLOUDSDK_CONFIG=%s/gcloud\nCLOUDSDK_CORE_DISABLE_PROMPTS=1\n' "$bundle" "$work" "$reports" "$work" >> "$GITHUB_ENV"
      - name: Receive the same private operation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.review_artifact_id }}
          run-id: ${{ inputs.review_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.BUNDLE }}
          merge-multiple: true
      - name: Prepare the reviewed Cloud SDK version
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 582.0.0
      - name: Admit the live runner, evidence and decision without protected inputs
        id: host_admission
        run: python -B -m scripts.int_noble_bootstrap_db protected-admit --bundle "$BUNDLE" --decision-sha256 "$DECISION_SHA" --review-sha256 "$REVIEW_SHA" --binding-sha256 "$BINDING_SHA"
      - name: Validate protected TLS inputs on the admitted runner
        id: protected_inputs
        if: ${{ success() && steps.host_admission.outcome == 'success' }}
        env:
          INT_PG_APP_PASSWORD: ${{ steps.host_admission.outcome == 'success' && secrets.INT_APP_PASSWORD || '' }}
          INT_PG_MIGRATOR_PASSWORD: ${{ steps.host_admission.outcome == 'success' && secrets.INT_MIGRATOR_PASSWORD || '' }}
          INT_PG_CA_CERT: ${{ steps.host_admission.outcome == 'success' && secrets.INT_POSTGRES_CA || '' }}
          INT_PG_SERVER_CERT: ${{ steps.host_admission.outcome == 'success' && secrets.INT_PG_SERVER_CERT || '' }}
          INT_PG_SERVER_KEY: ${{ steps.host_admission.outcome == 'success' && secrets.INT_PG_SERVER_KEY || '' }}
        run: python -B -m scripts.int_noble_bootstrap_db protected-local --bundle "$BUNDLE" --decision-sha256 "$DECISION_SHA" --review-sha256 "$REVIEW_SHA" --binding-sha256 "$BINDING_SHA" --workdir "$GUEST_WORK" --reports "$GUEST_REPORTS"
      - name: Start the conservative credential lifetime boundary
        run: echo "INT_GCP_AUTH_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Federate solely as the existing Deploy service account
        id: auth
        if: ${{ success() && steps.host_admission.outcome == 'success' && steps.protected_inputs.outcome == 'success' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Verify WIF, live VM and disks, policy and effective permissions
        id: cloud_preflight
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.int_noble_bootstrap_db cloud --bundle "$BUNDLE" --decision-sha256 "$DECISION_SHA" --review-sha256 "$REVIEW_SHA" --binding-sha256 "$BINDING_SHA" --workdir "$GUEST_WORK" --reports "$GUEST_REPORTS"
      - name: Recheck the fresh disk over pinned IAP and invoke the approved operator once
        if: ${{ success() && steps.host_admission.outcome == 'success' && steps.cloud_preflight.outcome == 'success' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          INT_PG_APP_PASSWORD: ${{ steps.host_admission.outcome == 'success' && steps.cloud_preflight.outcome == 'success' && secrets.INT_APP_PASSWORD || '' }}
          INT_PG_MIGRATOR_PASSWORD: ${{ steps.host_admission.outcome == 'success' && steps.cloud_preflight.outcome == 'success' && secrets.INT_MIGRATOR_PASSWORD || '' }}
          INT_PG_CA_CERT: ${{ steps.host_admission.outcome == 'success' && steps.cloud_preflight.outcome == 'success' && secrets.INT_POSTGRES_CA || '' }}
          INT_PG_SERVER_CERT: ${{ steps.host_admission.outcome == 'success' && steps.cloud_preflight.outcome == 'success' && secrets.INT_PG_SERVER_CERT || '' }}
          INT_PG_SERVER_KEY: ${{ steps.host_admission.outcome == 'success' && steps.cloud_preflight.outcome == 'success' && secrets.INT_PG_SERVER_KEY || '' }}
        run: python -B -m scripts.int_noble_bootstrap_db run --bundle "$BUNDLE" --decision-sha256 "$DECISION_SHA" --review-sha256 "$REVIEW_SHA" --binding-sha256 "$BINDING_SHA" --workdir "$GUEST_WORK" --reports "$GUEST_REPORTS"
      - name: Confirm removal of only this operation's temporary OS Login key
        if: ${{ always() && steps.scratch.outcome == 'success' && steps.auth.outcome == 'success' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python -B -m scripts.int_noble_bootstrap_db cleanup --workdir "$GUEST_WORK" --reports "$GUEST_REPORTS"
      - name: Retain the sanitized bootstrap and cleanup result
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: int-db01-noble-bootstrap-${{ github.sha }}-${{ github.run_id }}-1
          path: |
            ${{ env.GUEST_REPORTS }}/db01-result.json
            ${{ env.GUEST_REPORTS }}/db01-preflight-failure.json
            ${{ env.GUEST_REPORTS }}/cleanup.json
          if-no-files-found: warn
          retention-days: 7
