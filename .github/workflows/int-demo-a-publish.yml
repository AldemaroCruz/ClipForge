name: ClipForge INT A publish reviewed OCI artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Observe the existing standard host, or execute approved publication
        required: true
        type: choice
        default: observe
        options: [observe, publish]
      approved_commit:
        description: Exact approved source SHA
        required: true
        type: string
      decision_sha256:
        description: Independent SHA256 of the owner decision
        required: false
        type: string
      pointer_sha256:
        description: Canonical SHA256 of the protected private GCS pointer
        required: false
        type: string

permissions: {}
concurrency:
  group: clipforge-int-protected-operations
  cancel-in-progress: false

env:
  INT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
  GUEST_APPROVED_COMMIT: ${{ inputs.approved_commit }}
  GUEST_ENVIRONMENT: int
  DECISION_SHA: ${{ inputs.decision_sha256 }}
  POINTER_SHA: ${{ inputs.pointer_sha256 }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  observe-host:
    if: inputs.mode == 'observe' && github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.sha == inputs.approved_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the exact controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Measure the assigned runner without OIDC or registry access
        run: /usr/bin/python3 -E -s -B -m scripts.int_demo_a_publication_host --observe "$RUNNER_TEMP/native-publication-host-observed.json"
      - name: Retain bounded host facts for independent review
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: int-a-native-publication-host-${{ github.run_id }}-1
          path: ${{ runner.temp }}/native-publication-host-observed.json
          if-no-files-found: warn
          retention-days: 7

  local-preflight:
    if: inputs.mode == 'publish' && github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.sha == inputs.approved_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      verified_commit: ${{ steps.review.outputs.verified_commit }}
    steps:
      - name: Check out the exact controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact dispatch inputs without OIDC
        id: review
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -E -s -B -m scripts.int_demo_a_native_publication local --decision-sha256 "$DECISION_SHA" --pointer-sha256 "$POINTER_SHA"
          echo "verified_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  protected-operation:
    needs: local-preflight
    if: needs.local-preflight.result == 'success' && needs.local-preflight.outputs.verified_commit == github.sha
    environment: int
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      INT_DEMO_A_PROTECTED_DECISION_SHA256: ${{ vars.INT_DEMO_A_PUBLISH_DECISION_SHA256 }}
      INT_DEMO_A_PROTECTED_GATE_MODE: ${{ vars.INT_DEMO_A_GATE_MODE || 'global' }}
    steps:
      - name: Check out the exact controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check the environment approval and allocate private scratch
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$INT_APPROVED_COMMIT"
          umask 077
          test "$DECISION_SHA" = "$INT_DEMO_A_PROTECTED_DECISION_SHA256"
          git check-ignore --no-index --quiet gha-creds-demo-a.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          echo "INT_DEMO_A_WORK=$(mktemp -d "$RUNNER_TEMP/clipforge-demo-a.XXXXXXXX")" >> "$GITHUB_ENV"
      - name: Verify the reviewed live host and independent approval before WIF
        env:
          GH_TOKEN: ${{ github.token }}
          INT_DEMO_A_PUBLISH_POINTER_JSON: ${{ secrets.INT_DEMO_A_PUBLISH_POINTER_JSON }}
        run: /usr/bin/python3 -E -s -B -m scripts.int_demo_a_native_publication preauth --decision-sha256 "$DECISION_SHA" --pointer-sha256 "$POINTER_SHA"
      - name: Request a separate read-only Cloud Storage token using existing Deploy WIF
        id: read-input
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only
          create_credentials_file: false
          export_environment_variables: false
          cleanup_credentials: true
      - name: Verify and fetch exactly one private GCS generation
        env:
          GCP_READ_ACCESS_TOKEN: ${{ steps.read-input.outputs.access_token }}
          INT_DEMO_A_PUBLISH_POINTER_JSON: ${{ secrets.INT_DEMO_A_PUBLISH_POINTER_JSON }}
        run: /usr/bin/python3 -E -s -B -m scripts.int_demo_a_native_publication fetch --decision-sha256 "$DECISION_SHA" --pointer-sha256 "$POINTER_SHA"
      - name: Validate the private gate and stage the exact native publisher before write credentials
        env:
          INT_DEMO_A_PUBLISH_POINTER_JSON: ${{ secrets.INT_DEMO_A_PUBLISH_POINTER_JSON }}
        run: /usr/bin/python3 -E -s -B -m scripts.int_demo_a_native_publication stage --decision-sha256 "$DECISION_SHA" --pointer-sha256 "$POINTER_SHA"
      - name: Record the start of the short WIF credential budget
        run: echo "INT_DEMO_A_AUTH_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Federate solely as the existing Deploy service account
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Execute the approved scope once and preserve the result
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          INT_DEMO_A_PUBLISH_POINTER_JSON: ${{ secrets.INT_DEMO_A_PUBLISH_POINTER_JSON }}
        run: /usr/bin/python3 -E -s -B -m scripts.int_demo_a_native_publication execute --decision-sha256 "$DECISION_SHA" --pointer-sha256 "$POINTER_SHA"
