name: ClipForge INT partial foundation recovery plan only

on:
  workflow_dispatch:
    inputs:
      reviewed_controls_commit:
        description: Exact reviewed preparation SHA; must equal this dispatch SHA
        type: string
        required: true

permissions: {}
concurrency:
  group: clipforge-int-terraform-state
  cancel-in-progress: false

jobs:
  recovery-plan:
    if: github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: int
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      INT_REVIEWED_CONTROLS_COMMIT: ${{ inputs.reviewed_controls_commit }}
      INT_STAGE: foundation
      MACHINE_TYPE: e2-micro
      SECRET_VERSIONS_JSON: "null"
      RUNTIME_IMAGE: us-central1-docker.pkg.dev/clipforgebeta2/clipforge-int/runtime@sha256:d4b65631b30c26785ae18898cd826990fa20b4dce45015fb241ba108ddba7d49
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact reviewed preparation without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bind the dispatch and allocate private scratch
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -B -c 'import os; from scripts.check_tf_int import validate_variables, require; validate_variables(os.environ); require(os.environ["GITHUB_SHA"] == os.environ["INT_REVIEWED_CONTROLS_COMMIT"], "Dispatch SHA differs from reviewed controls")'
          git check-ignore --no-index --quiet gha-creds-tf-int01.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          printf 'TF_INT_WORK_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-int01.XXXXXXXX")" >> "$GITHUB_ENV"
          printf 'TF_INT_REPORT_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-report.XXXXXXXX")" >> "$GITHUB_ENV"

      - name: Set up the original fixed Terraform release
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Prepare the same native checking tools separately with network
        shell: bash
        run: |
          docker pull ghcr.io/aquasecurity/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6
          docker pull hashicorp/terraform:1.15.8@sha256:7ae513256f7ce67879e218ae8593d6fbe216ec9e123abe6c94e4e10704857963
          docker pull python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df

      - name: Preserve native base checks and validate the bounded recovery path
        shell: bash
        run: |
          python -B scripts/tf_int_plan.py checks
          python -B -m scripts.int_foundation_recovery check
          python -B -m unittest tests.test_int_foundation_recovery -v

      - name: Authenticate Terraform through the existing WIF provider
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Verify the exact partial state and preview imports in one real private plan
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: python -B -m scripts.int_foundation_recovery plan

      - name: Retain only the bounded public recovery summary
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: int-recovery-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TF_INT_REPORT_DIR }}/recovery-summary.json
            ${{ env.TF_INT_REPORT_DIR }}/recovery-summary.md
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      - name: Remove only this runner's private plan and backend scratch
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        run: python -B scripts/tf_int_plan.py cleanup
