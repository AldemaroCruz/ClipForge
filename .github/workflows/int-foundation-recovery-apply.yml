name: DEPRECATED - ClipForge INT apply exact reviewed recovery plan

# Historical source only. All Hito A mutations now belong to int-hito-a.yml.
on:
  workflow_call:
    inputs:
      approved_control_commit:
        description: Full reviewed dispatch controls SHA; configuration stays at 264d1cf
        type: string
        required: true
      recovery_decision_json:
        description: Exact owner decision for this recovery binary and new execution route; pending is refused
        type: string
        default: "null"
      recovery_decision_sha256:
        description: SHA256 of canonical reviewed recovery decision JSON
        type: string
        required: true
      iam_receipts_json:
        description: Reviewed sanitized IAM receipt bundle with exact index and phase JSON strings; no policies or credentials
        type: string
        default: "null"

permissions: {}
concurrency:
  group: clipforge-int-terraform-state
  cancel-in-progress: false

jobs:
  apply-reviewed-recovery:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    environment: int
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      INT_STAGE: foundation
      MACHINE_TYPE: e2-micro
      SECRET_VERSIONS_JSON: "null"
      RUNTIME_IMAGE: us-central1-docker.pkg.dev/clipforgebeta2/clipforge-int/runtime@sha256:d4b65631b30c26785ae18898cd826990fa20b4dce45015fb241ba108ddba7d49
      INT_APPROVED_COMMIT: ${{ inputs.approved_control_commit }}
      RECOVERY_DECISION_JSON: ${{ inputs.recovery_decision_json }}
      RECOVERY_DECISION_SHA256: ${{ inputs.recovery_decision_sha256 }}
      RECOVERY_IAM_RECEIPTS_JSON: ${{ inputs.iam_receipts_json }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact dispatch controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out immutable recovery plan producer separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AldemaroCruz/ClipForge
          ref: 264d1cfad6500e1abd60d3e7f966a3614a3a5831
          path: plan-source
          persist-credentials: false
          fetch-depth: 1

      - name: Validate sources and allocate private scratch
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$INT_APPROVED_COMMIT" = "$GITHUB_SHA"
          test "$(git -C plan-source rev-parse HEAD)" = 264d1cfad6500e1abd60d3e7f966a3614a3a5831
          python -B -m scripts.int_foundation_recovery_apply check
          python -B -m unittest tests.test_int_foundation_recovery_apply -v
          git check-ignore --no-index --quiet gha-creds-tf-int01.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          printf 'TF_INT_WORK_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-int01.XXXXXXXX")" >> "$GITHUB_ENV"
          printf 'TF_INT_REPORT_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-report.XXXXXXXX")" >> "$GITHUB_ENV"

      - name: Prepare pinned Terraform without wrapper
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Authenticate Terraform using existing WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Require fresh foundation evidence and exact decision; apply only saved recovery binary
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python -B -m scripts.int_foundation_recovery_apply apply

      - name: Preserve only allowlisted recovery apply summary
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: int-recovery-apply-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TF_INT_REPORT_DIR }}/summary.json
            ${{ env.TF_INT_REPORT_DIR }}/summary.md
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false

      - name: Remove only this run's private scratch
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        run: python -B scripts/tf_int_plan.py cleanup
