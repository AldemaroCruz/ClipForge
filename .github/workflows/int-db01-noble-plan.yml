name: ClipForge DB-01 Noble private additive plan

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact reviewed DB-01 Noble plan controls SHA
        type: string
        required: true
      iam_receipt:
        description: Immutable stable READ IAM custody reference JSON
        type: string
        required: true

permissions: {}
concurrency:
  group: clipforge-int-terraform-state
  cancel-in-progress: false

jobs:
  noble-plan:
    if: github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: int
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      DB01_NOBLE_APPROVED_COMMIT: ${{ inputs.approved_commit }}
      DB01_NOBLE_IAM_RECEIPT: ${{ inputs.iam_receipt }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact dispatch commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Bind the reviewed SHA and allocate private scratch
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_SHA" = "$DB01_NOBLE_APPROVED_COMMIT"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          git check-ignore --no-index --quiet gha-creds-db01-noble.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          printf 'TF_INT_WORK_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-int01.XXXXXXXX")" >> "$GITHUB_ENV"
          printf 'TF_INT_REPORT_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-report.XXXXXXXX")" >> "$GITHUB_ENV"

      - name: Prepare the exact Terraform release
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Prepare the separately pinned IaC scanner
        run: docker pull ghcr.io/aquasecurity/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6

      - name: Validate the plan contract and the candidate configuration
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_db01_noble_plan tests.test_db01_noble_read
          python -B -m scripts.db01_noble_plan checks

      - name: Authenticate the existing Terraform account through protected WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Verify the eleven stable read operations with the Terraform identity
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          export DB01_NOBLE_READ_REPORT="$TF_INT_REPORT_DIR/iam-read-preflight.json"
          python -B -m scripts.db01_noble_read stable-precheck

      - name: Verify the exact IAM delta and state, then generate one private native plan
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python -B -m scripts.db01_noble_plan plan

      - name: Retain only the permitted plan summary
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db01-noble-plan-summary-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TF_INT_REPORT_DIR }}/summary.json
            ${{ env.TF_INT_REPORT_DIR }}/summary.md
            ${{ env.TF_INT_REPORT_DIR }}/iam-read-preflight.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

      - name: Remove only this run's local full plan and Terraform scratch
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        run: python -B -m scripts.tf_int_plan cleanup
