name: ClipForge INT IAP read diagnosis and serial6 planning

on:
  workflow_dispatch:
    inputs:
      reviewed_control_commit:
        description: Full reviewed diagnostic controls SHA; must equal dispatch commit
        required: true
        type: string
      attempt_recovery_plan:
        description: Attempt only a private plan when the verified serial6 guard is activated; never apply
        type: boolean
        default: true

permissions: {}
concurrency:
  group: clipforge-int-terraform-state
  cancel-in-progress: false

jobs:
  read-diagnosis:
    if: github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: int
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_TERRAFORM_SA: ${{ vars.GCP_TERRAFORM_SA }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
      INT_REVIEWED_CONTROLS_COMMIT: ${{ inputs.reviewed_control_commit }}
      IAP_ATTEMPT_RECOVERY_PLAN: ${{ inputs.attempt_recovery_plan }}
      INT_STAGE: foundation
      MACHINE_TYPE: e2-micro
      SECRET_VERSIONS_JSON: "null"
      RUNTIME_IMAGE: us-central1-docker.pkg.dev/clipforgebeta2/clipforge-int/runtime@sha256:d4b65631b30c26785ae18898cd826990fa20b4dce45015fb241ba108ddba7d49
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact diagnostic controls before WIF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate source contract and allocate private scratch
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$INT_REVIEWED_CONTROLS_COMMIT" = "$GITHUB_SHA"
          python -B -m scripts.int_iap_diagnostic check
          python -B -m unittest tests.test_int_iap_diagnostic tests.test_int_foundation_recovery -v
          git check-ignore --no-index --quiet gha-creds-tf-int01.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          printf 'TF_INT_WORK_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-int01.XXXXXXXX")" >> "$GITHUB_ENV"
          printf 'TF_INT_REPORT_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/clipforge-tf-report.XXXXXXXX")" >> "$GITHUB_ENV"
      - name: Prepare exact Terraform without wrapper
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Authenticate only Terraform using existing WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Compare explicit token and native provider ADC reads; no grants or apply
        shell: bash
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python -B -m scripts.int_iap_diagnostic diagnose
      - name: Retain only sanitized diagnosis and optional plan summaries
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: int-iap-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TF_INT_REPORT_DIR }}/iap-diagnostic.json
            ${{ env.TF_INT_REPORT_DIR }}/iap-diagnostic.md
            ${{ env.TF_INT_REPORT_DIR }}/recovery-summary.json
            ${{ env.TF_INT_REPORT_DIR }}/recovery-summary.md
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
      - name: Remove only this run private native logs, policies, plans and scratch
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        shell: bash
        run: python -B scripts/tf_int_plan.py cleanup
