name: ClipForge INT protected secret version
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact owner-approved commit; this operation remains separate from plan approval
        type: string
        required: true
      target:
        description: Existing reviewed container only; payload comes from protected GitHub Secrets
        type: choice
        options: [app_password, migrator_password, postgres_ca, bootstrap_admin]
permissions: {}
concurrency:
  group: clipforge-int-protected-operations
  cancel-in-progress: false
jobs:
  protected-operation:
    if: github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: int
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      INT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the exact dispatch source before WIF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Authenticate deployment identity using existing WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Add one secret version after current application CI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          INT_SECRET_PAYLOAD: ${{ secrets[format('INT_{0}', inputs.target)] }}
          INT_SECRET_TARGET: ${{ inputs.target }}
        run: python -B -m scripts.int_secrets "$INT_SECRET_TARGET"
