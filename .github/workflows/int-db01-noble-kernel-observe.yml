name: ClipForge DB-01 Noble bounded kernel observation

on:
  workflow_dispatch:
    inputs:
      approved_control_commit:
        description: Exact approved Noble execution controls SHA
        required: true
        type: string
      host_pin_json:
        description: Verified first-boot public host key receipt
        required: true
        type: string

permissions: {}
concurrency:
  group: clipforge-int-db01-noble
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'AldemaroCruz/ClipForge' && github.ref == 'refs/heads/ci/bootstrap-sec03' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: int
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GUEST_APPROVED_COMMIT: ${{ inputs.approved_control_commit }}
      GUEST_ENVIRONMENT: int
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
    steps:
      - name: Check out the exact approved controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the selected creation run and allocate isolated scratch
        id: scratch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GUEST_APPROVED_COMMIT" = "$GITHUB_SHA"
          test "$GCP_PROJECT_ID" = clipforgebeta2
          test "$GCP_PROJECT_NUMBER" = 816643438938
          test "$GCP_REGION" = us-central1
          test "$GCP_DEPLOY_SA" = clipforge-deploy-int@clipforgebeta2.iam.gserviceaccount.com
          test "$GCP_WIF_PROVIDER" = projects/816643438938/locations/global/workloadIdentityPools/clipforge-gh-int/providers/github
          git check-ignore --no-index --quiet gha-creds-noble-observe.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          python -B -m scripts.int_noble_kernel_observation verify-handoff
          work="$(mktemp -d "$RUNNER_TEMP/clipforge-guest-inventory.XXXXXXXX")"
          reports="$(mktemp -d "$RUNNER_TEMP/clipforge-guest-report.XXXXXXXX")"
          handoff="$(mktemp -d "$RUNNER_TEMP/clipforge-noble-handoff.XXXXXXXX")"
          printf 'GUEST_WORK=%s\nGUEST_REPORTS=%s\nNOBLE_HANDOFF=%s\nCLOUDSDK_CONFIG=%s/gcloud\nCLOUDSDK_CORE_DISABLE_PROMPTS=1\n' "$work" "$reports" "$handoff" "$work" >> "$GITHUB_ENV"

      - name: Receive the exact existing postverification handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: db01-noble-postverify-summary-d6915938ea056d6df6e15d29457c0f0c1f46a69e-44772432816-1
          path: ${{ env.NOBLE_HANDOFF }}
          run-id: '44772432816'
          github-token: ${{ github.token }}

      - name: Verify the receipt bytes and exact public key before federation
        env:
          NOBLE_HOST_PIN_JSON: ${{ inputs.host_pin_json }}
        run: python -B -m scripts.int_noble_kernel_observation check

      - name: Federate solely as the Deploy service account
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Prepare the reviewed Cloud SDK version
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 582.0.0

      - name: Read only Xen netback, Ceph and NFS server metadata over strict IAP SSH
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          NOBLE_HOST_PIN_JSON: ${{ inputs.host_pin_json }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          git check-ignore --quiet -- "$GOOGLE_APPLICATION_CREDENTIALS"
          python -B -m scripts.int_noble_kernel_observation run

      - name: Confirm removal of only this attempt's expiring OS Login key
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python -B -m scripts.int_noble_kernel_observation cleanup

      - name: Retain only the bounded kernel evidence and OS Login cleanup
        if: ${{ always() && steps.scratch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db01-noble-kernel-observation-${{ github.sha }}-${{ github.run_id }}-1
          path: |
            ${{ env.GUEST_REPORTS }}/guest-summary.json
            ${{ env.GUEST_REPORTS }}/inventory.json
            ${{ env.GUEST_REPORTS }}/cleanup.json
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
