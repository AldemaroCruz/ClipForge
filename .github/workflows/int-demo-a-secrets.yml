name: DEPRECATED - ClipForge INT A publish four numeric secret versions

# Historical source only. Hito A secret versions now belong to int-hito-a.yml.
on:
  workflow_call:
    inputs:
      approved_commit:
        description: Exact approved source SHA
        required: true
        type: string
      bundle_run:
        description: Producer run of the private decision and evidence bundle
        required: true
        type: string
      bundle_artifact:
        description: Exact artifact ID of the private bundle
        required: true
        type: string
      decision_sha256:
        description: Independent SHA256 of the owner decision
        required: true
        type: string

permissions: {}
concurrency:
  group: clipforge-int-protected-operations
  cancel-in-progress: false

env:
  INT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
  GUEST_APPROVED_COMMIT: ${{ inputs.approved_commit }}
  GUEST_ENVIRONMENT: int
  BUNDLE_RUN: ${{ inputs.bundle_run }}
  BUNDLE_ARTIFACT: ${{ inputs.bundle_artifact }}
  DECISION_SHA: ${{ inputs.decision_sha256 }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  local-preflight:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      verified_commit: ${{ steps.review.outputs.verified_commit }}
    steps:
      - name: Check out the exact controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check local inputs and reserve bundle directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUNDLE_ARTIFACT" =~ ^[1-9][0-9]*$ && "$BUNDLE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$DECISION_SHA" =~ ^[a-f0-9]{64}$ ]]
          test "$GITHUB_SHA" = "$INT_APPROVED_COMMIT"
          umask 077
          echo "INT_DEMO_A_BUNDLE=$(mktemp -d "$RUNNER_TEMP/clipforge-a-bundle.XXXXXXXX")" >> "$GITHUB_ENV"
      - name: Receive immutable decision and evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.bundle_artifact }}
          run-id: ${{ inputs.bundle_run }}
          github-token: ${{ github.token }}
          path: ${{ env.INT_DEMO_A_BUNDLE }}
          merge-multiple: true
      - name: Validate decision and scope without OIDC
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -m scripts.int_demo_a_secrets local --bundle "$INT_DEMO_A_BUNDLE" --decision-sha256 "$DECISION_SHA"
          echo "verified_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  protected-operation:
    needs: local-preflight
    if: ${{ false }}
    environment: int
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      INT_DEMO_A_PROTECTED_DECISION_SHA256: ${{ vars.INT_DEMO_A_SECRETS_DECISION_SHA256 }}
      INT_DEMO_A_PROTECTED_GATE_MODE: ${{ vars.INT_DEMO_A_SECRETS_GATE_MODE || 'global' }}
    steps:
      - name: Check out the exact controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check the environment approval and allocate private scratch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUNDLE_ARTIFACT" =~ ^[1-9][0-9]*$ && "$BUNDLE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$DECISION_SHA" =~ ^[a-f0-9]{64}$ ]]
          test "$GITHUB_SHA" = "$INT_APPROVED_COMMIT"
          umask 077
          test "$DECISION_SHA" = "$INT_DEMO_A_PROTECTED_DECISION_SHA256"
          git check-ignore --no-index --quiet gha-creds-demo-a.json
          test -z "$(git ls-files -- ':(glob)**/gha-creds-*.json')"
          echo "INT_DEMO_A_BUNDLE=$(mktemp -d "$RUNNER_TEMP/clipforge-a-bundle.XXXXXXXX")" >> "$GITHUB_ENV"
          echo "INT_DEMO_A_WORK=$(mktemp -d "$RUNNER_TEMP/clipforge-demo-a.XXXXXXXX")" >> "$GITHUB_ENV"
      - name: Receive immutable decision and evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.bundle_artifact }}
          run-id: ${{ inputs.bundle_run }}
          github-token: ${{ github.token }}
          path: ${{ env.INT_DEMO_A_BUNDLE }}
          merge-multiple: true
      - name: Admit the live runner, evidence and decision without protected inputs
        id: host_admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.int_demo_a_secrets protected-admit --bundle "$INT_DEMO_A_BUNDLE" --decision-sha256 "$DECISION_SHA"
      - name: Validate protected secret inputs on the admitted runner without WIF
        id: protected_inputs
        if: ${{ success() && steps.host_admission.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INT_PG_APP_PASSWORD: ${{ steps.host_admission.outcome == 'success' && secrets.INT_APP_PASSWORD || '' }}
          INT_PG_MIGRATOR_PASSWORD: ${{ steps.host_admission.outcome == 'success' && secrets.INT_MIGRATOR_PASSWORD || '' }}
          INT_PG_CA_CERT: ${{ steps.host_admission.outcome == 'success' && secrets.INT_POSTGRES_CA || '' }}
          INT_BOOTSTRAP_ADMIN: ${{ steps.host_admission.outcome == 'success' && secrets.INT_BOOTSTRAP_ADMIN_JSON || '' }}
        run: python -B -m scripts.int_demo_a_secrets protected-local --bundle "$INT_DEMO_A_BUNDLE" --decision-sha256 "$DECISION_SHA"
      - name: Record the start of the short WIF credential budget
        run: echo "INT_DEMO_A_AUTH_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Federate solely as the existing Deploy service account
        id: auth
        if: ${{ success() && steps.host_admission.outcome == 'success' && steps.protected_inputs.outcome == 'success' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true
      - name: Execute the approved scope once and preserve the result
        if: ${{ success() && steps.host_admission.outcome == 'success' && steps.auth.outcome == 'success' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          INT_PG_APP_PASSWORD: ${{ steps.host_admission.outcome == 'success' && steps.auth.outcome == 'success' && secrets.INT_APP_PASSWORD || '' }}
          INT_PG_MIGRATOR_PASSWORD: ${{ steps.host_admission.outcome == 'success' && steps.auth.outcome == 'success' && secrets.INT_MIGRATOR_PASSWORD || '' }}
          INT_PG_CA_CERT: ${{ steps.host_admission.outcome == 'success' && steps.auth.outcome == 'success' && secrets.INT_POSTGRES_CA || '' }}
          INT_BOOTSTRAP_ADMIN: ${{ steps.host_admission.outcome == 'success' && steps.auth.outcome == 'success' && secrets.INT_BOOTSTRAP_ADMIN_JSON || '' }}
        run: python -B -m scripts.int_demo_a_secrets execute --bundle "$INT_DEMO_A_BUNDLE" --decision-sha256 "$DECISION_SHA"
