<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipForge · Iniciar sesión</title><link rel="stylesheet" href="/static/account.css"><script src="/static/auth.js" defer></script><script src="/static/account.js" defer></script></head>
<body><main class="login"><div class="eyebrow">ClipForge · Estudio local</div><h1>Tu espacio de trabajo</h1><p class="muted">Inicia sesión para abrir tus proyectos y continuar editando.</p><section class="panel"><h2>Iniciar sesión</h2><form id="login-form"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required maxlength="64" autofocus><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><div class="actions"><button type="submit">Entrar</button></div><p id="login-status" class="status" role="alert" aria-live="polite"></p></form></section><p class="muted">Tu administrador debe crear la cuenta. No hay registro público.</p><p><a href="/recover">Tengo un código de recuperación</a></p></main></body></html>
