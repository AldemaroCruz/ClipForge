services:
  clipforge:
    build: .
    ports:
      # Local-only: this MVP has no authentication.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./cache/huggingface:/models/huggingface
    environment:
      WHISPER_MODEL: tiny
      MAX_UPLOAD_MB: "300"
      HF_HOME: /models/huggingface
      FFMPEG_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: unless-stopped
